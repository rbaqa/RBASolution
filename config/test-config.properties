# ============================================================================
# RBA Task - central test configuration
#
# 12-factor principle: configuration is externalised, environment specific
# values can be overridden via environment variables or -D system properties.
# Property keys follow the pattern: <group>.<name>
# Example override via env var:  ENV_BASE_URL=https://www.rba.hr
# Example override via system:   -Dbase.url=https://www.rba.hr
# ============================================================================

# --- Browser / Selenium ---
browser=chrome
browser.headless=false
selenium.explicit.timeout.seconds=30
selenium.page.load.timeout.seconds=60

# --- Application under test ---
app.base.url=https://www.rba.hr

# --- Exchange calculator scenario data ---
# Currency numeric codes used by the RBA calculator options (EUR=978, GBP=826, USD=840)
# Transaction 1: BUY GBP / kupnja funti  -> bank sells GBP -> use Prodajni (2) mode
calc.buy.mode=2
calc.buy.currency1.code=EUR
calc.buy.currency1.id=978
calc.buy.currency2.code=GBP
calc.buy.currency2.id=826
calc.buy.amount=40
# Transaction 2: SELL USD / prodaja dolara -> bank buys USD -> use Kupovni (0) mode
calc.sell.mode=0
calc.sell.currency1.code=USD
calc.sell.currency1.id=840
calc.sell.currency2.code=EUR
calc.sell.currency2.id=978
calc.sell.amount=100
calc.browser.checkbox.accept=true

# --- Wikipedia API ---
wikipedia.api.url=https://en.wikipedia.org/w/api.php
wikipedia.search.query=Raiffeisen
wikipedia.expected.title=Raiffeisen Bank International
wikipedia.max.seconds=5
wikipedia.first.results=10

# --- Api currency reference (Basic REST example) ---
api.currency.symbol=GBP
api.currency.convert.amount=40
