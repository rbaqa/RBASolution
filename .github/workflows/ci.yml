name: RBA QA CI

# ---------------------------------------------------------------------------
# CI: full QA / test build on every trigger.
#   every run -> static analysis gate (checkstyle + SpotBugs)
#             -> Windows lifecycle (clean env, full regression)
#             -> Linux lifecycle (clean env, full regression)
#             -> Allure report publishing (deployed to Pages on master)
#
# Suite files map to tiers:
#   smoke.xml    -> unit + API + core UI tests tagged with the 'smoke' group
#   testng.xml   -> the full regression suite (every test)
# ---------------------------------------------------------------------------
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly full regression against the live site (runs on the default branch)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  quality:
    name: Static analysis (checkstyle + SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java (JDK 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run quality gate (checkstyle + SpotBugs, no tests)
        run: ./mvnw -B -Pquality -DskipTests verify

  # ---------------------------------------------------------------------------
  # Fast tier: unit + API + the core UI test, run on EVERY trigger (PR, push,
  # schedule, manual). Keeps PR feedback to a couple of minutes while still
  # covering the highest-value scenarios.
  # ---------------------------------------------------------------------------
  test:
    name: Smoke gate (unit + API + core UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java (JDK 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # Ubuntu runners ship with a recent Google Chrome; WebDriverManager
      # resolves the matching chromedriver automatically.

      - name: Run smoke suite (unit + API + core UI headless)
        run: ./mvnw -B -Dsuite.file=smoke.xml test
        env:
          ENV_BROWSER_HEADLESS: "true"

      - name: Verify deterministic stub API tier (WireMock, no live RBA)
        run: ./mvnw -B -Denv=stub -Dsuite.file=api-stub.xml test

      - name: Upload classic TestNG/Surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: reports/allure-results

      - name: Upload screenshots (UI failures)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: reports/screenshots
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Full regression on a CLEAN environment. Runs on EVERY trigger (push, PR,
  # schedule, manual dispatch) so every build surfaces the same QA signal.
  # ---------------------------------------------------------------------------

  # Full clean-environment lifecycle on Windows:
  #   setup (installs JDK 8 + Chrome if missing) -> run all tests -> generate
  #   reports -> teardown (uninstalls everything setup-env.ps1 installed, so a
  #   server returns to its clean state with ONLY reports remaining).
  windows-clean-env-run:
    name: Windows lifecycle (setup > test > report > teardown)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Provision clean environment (installs JDK 8 + Chrome if missing)
        shell: powershell
        run: .\setup-env.ps1

      - name: Run full test suite (unit + API + Selenium headless)
        shell: powershell
        # --% (stop-parsing) is required: PS 5.1 splits "-Dsuite.file=..." 
        # into "-Dsuite" + ".file=testng.xml" when invoking a .cmd batch.
        run: .\mvnw.cmd --% -B -Dsuite.file=testng.xml test
        env:
          ENV_BROWSER_HEADLESS: "true"

      - name: Generate Allure report
        if: always()
        shell: powershell
        run: .\mvnw.cmd -B allure:report

      # Reports are uploaded BEFORE teardown so they are preserved as artifacts
      # even though the environment itself is wiped afterwards.

      - name: Upload Install/Teardown marker (debug)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: setup-marker
          path: reports/.setup-installed.json
          if-no-files-found: ignore

      - name: Upload Surefire/TestNG reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports-win
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-win
          path: reports/allure-results
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report-win
          path: reports/allure-report
          if-no-files-found: warn

      - name: Upload screenshots (UI failures)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-win
          path: reports/screenshots
          if-no-files-found: ignore

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-summary-win
          path: reports/test-summary.txt
          if-no-files-found: ignore

      - name: Teardown - uninstall environment, keep only reports
        if: always()
        shell: powershell
        run: .\setup-env.ps1 -Uninstall

  # ---------------------------------------------------------------------------
  # Full clean-environment lifecycle on Linux (bash twin of the Windows job),
  # and the source of truth for the linkable Allure report published to GitHub
  # Pages after a full regression run:
  #   setup.sh (installs JDK 8 + Chrome if missing) -> run all tests ->
  #   generate reports -> teardown (uninstalls everything setup-env.sh
  #   installed, so a server returns to its clean state with ONLY reports left).
  # ---------------------------------------------------------------------------
  linux-clean-env-run:
    name: Linux lifecycle (setup > test > report > teardown)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Provision clean environment (installs JDK 8 + Chrome if missing)
        run: bash ./setup-env.sh

      - name: Run full test suite (unit + API + Selenium headless)
        run: ./mvnw -B -Dsuite.file=testng.xml test
        env:
          ENV_BROWSER_HEADLESS: "true"

      - name: Generate Allure report
        if: always()
        run: ./mvnw -B allure:report

      # Reports are uploaded BEFORE teardown so they are preserved as artifacts
      # even though the environment itself is wiped afterwards.

      - name: Upload Install/Teardown marker (debug)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: setup-marker-linux
          path: reports/.setup-installed.json
          if-no-files-found: ignore

      - name: Upload Surefire/TestNG reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports-linux
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-linux
          path: reports/allure-results
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report-linux
          path: reports/allure-report
          if-no-files-found: warn

      - name: Upload screenshots (UI failures)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-linux
          path: reports/screenshots
          if-no-files-found: ignore

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-summary-linux
          path: reports/test-summary.txt
          if-no-files-found: ignore

      - name: Teardown - uninstall environment, keep only reports
        if: always()
        run: bash ./setup-env.sh --uninstall

  # ---------------------------------------------------------------------------
  # Publish the Allure report to GitHub Pages so it gets a stable, linkable URL:
  #   https://rbaqa.github.io/RBASolution/
  # Generated from the full regression (Windows + Linux lifecycles), not the
  # smoke gate, and runs on EVERY trigger (push, PR, nightly, manual) so the
  # report-producing pipeline is validated on every build.
  #
  # The final deployment (actions/deploy-pages) populates the single Pages site
  # for the repo, so it is gated to runs on 'master' (push/schedule/manual) -
  # PR runs generate + upload the report artifact but do NOT overwrite the live
  # linkable URL with branch content.
  #
  # Uses the modern, officially-supported Pages deployment (actions/deploy-pages)
  # backed by the Pages API - no branch commits and no token-in-URL, so it works
  # on public and private repos alike.
  #
  # REQUIRED one-time repo setting (unavoidable - Pages must be enabled):
  #   Settings -> Pages -> Source: "GitHub Actions"
  #   (NOT "Deploy from a branch"). That's the only manual step; no branch or
  #   workflow/API config is needed after that.
  # ---------------------------------------------------------------------------
  allure-report-pages:
    name: Publish Allure report to GitHub Pages
    needs: [windows-clean-env-run, linux-clean-env-run]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java (JDK 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Download Allure results (from Linux full regression)
        uses: actions/download-artifact@v5
        with:
          name: allure-results-linux
          path: reports/allure-results

      - name: Generate Allure HTML report
        run: ./mvnw -B allure:report

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v4